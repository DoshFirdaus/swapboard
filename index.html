<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3FD1">
<title>Swapboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#151B2E; --muted:#5B6479; --line:#D6DCE6;
  --blue:#1F3FD1; --blue-ink:#FFFFFF; --tag:#FFD43B; --tag-ink:#151B2E; --danger:#B42318; --ok:#1B7F4B;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10141F; --surface:#1A2030; --ink:#E8ECF4; --muted:#9AA3B8; --line:#2A3244;
         --blue:#7D92FF; --blue-ink:#0E1330; --danger:#FF8A80; --ok:#6FD39B; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;max-width:960px;margin:0 auto}
.brand{font:800 26px/1 var(--display);letter-spacing:-.02em;color:var(--ink);text-decoration:none}
h1,h2{font-family:var(--display);letter-spacing:-.015em;margin:.2em 0 .5em}
h1{font-size:28px;font-weight:800} h2{font-size:21px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.stack>*+*{margin-top:12px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:120px;resize:vertical}
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:12px 18px;border-radius:999px;border:0;background:var(--blue);color:var(--blue-ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid currentColor}
.btn[disabled]{opacity:.55;cursor:wait}
.btn.block{width:100%}
.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:16px}
.search select{width:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;display:block;background:var(--surface);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid var(--line)}
.card .ph{aspect-ratio:1;background:var(--line);display:block;width:100%;object-fit:cover}
.card .meta{padding:10px 12px 12px}
.card .t{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* The price tag: the one bold element */
.tag{position:absolute;top:10px;left:0;background:var(--tag);color:var(--tag-ink);font:800 16px/1 var(--display);padding:7px 12px 7px 20px;
  clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--surface)}
.tag.big{position:relative;top:0;display:inline-block;font-size:26px;padding:10px 16px 10px 26px;clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 50%)}
.tag.big::before{left:12px;width:7px;height:7px;margin-top:-3.5px}
.sold{position:absolute;top:10px;right:10px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;border-radius:14px}
.gallery img{flex:0 0 100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:start;border-radius:14px;background:var(--line)}
@media(min-width:640px){.gallery img{flex-basis:70%}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.notice{border-left:4px solid var(--tag);padding:10px 14px;background:var(--surface);border-radius:8px;font-size:14px}
.empty{text-align:center;padding:48px 16px}
.list a{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;margin-bottom:8px}
.list img,.list .noimg{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
.chat{display:flex;flex-direction:column;gap:6px;min-height:40vh;max-height:60vh;overflow-y:auto;padding:8px 0}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--blue);color:var(--blue-ink);border-color:transparent}
.msg time{display:block;font-size:11px;opacity:.7;margin-top:2px}
.composer{display:grid;grid-template-columns:1fr auto;gap:8px;position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.bar a{display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
nav.bar a svg{width:24px;height:24px;margin-bottom:2px}
nav.bar a.on{color:var(--blue)}
nav.bar a.sell svg{background:var(--tag);color:var(--tag-ink);border-radius:50%;padding:3px;width:30px;height:30px;margin-top:-4px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:10;max-width:90vw}
.err{color:var(--danger);font-size:14px}
@media (prefers-reduced-motion: no-preference){ .toast{animation:pop .2s ease-out} @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}} }
</style>
</head>
<body>
<header class="top"><a class="brand" href="#/">Swapboard</a><span id="who" class="small muted"></span></header>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>
<nav class="bar" id="nav">
  <a href="#/" data-r="browse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Browse</a>
  <a href="#/new" data-r="new" class="sell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 6v12M6 12h12"/></svg>Sell</a>
  <a href="#/inbox" data-r="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg>Chats</a>
  <a href="#/mine" data-r="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</a>
</nav>

<script src="app1.js?v=1"></script>
<script src="app2.js?v=1"></script>
</body>
</html>
