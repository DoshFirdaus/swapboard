<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swapboard check</title>
<body style="font:18px/1.6 system-ui;padding:16px;background:#fff;color:#111">
<h2>Swapboard check</h2><ol id="o"></ol>
<script>
const o=document.getElementById("o"), say=(t,ok)=>{const li=document.createElement("li");li.textContent=(ok?"OK: ":"PROBLEM: ")+t;li.style.color=ok?"green":"red";o.appendChild(li);};
window.onerror=(m,src,line)=>say("Error in "+(src||"").split("/").pop()+" line "+line+": "+m,false);
const load=f=>new Promise(r=>{const s=document.createElement("script");s.src=f+"?c="+Date.now();s.onload=()=>{say(f+" found",true);r(true)};s.onerror=()=>{say(f+" is missing (404). Check the file name.",false);r(false)};document.body.appendChild(s);});
(async()=>{
 await load("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
 document.body.insertAdjacentHTML("beforeend",'<div id="app" hidden></div><span id="who" hidden></span><nav class="bar" hidden></nav>');
 await load("app1.js"); await load("app2.js"); await load("app3.js"); await load("app4.js"); await load("app5.js");
 for (const fn of ["route","browse","listing","newListing","inbox","chat","mine","login","startUnread","savePushToken","loadSafety","enhance","priceText","safePage","editListing"])
   say("function "+fn+(typeof window[fn]==="function"?" present":" MISSING, so that file was cut short"), typeof window[fn]==="function");
 await new Promise(r=>setTimeout(r,2500));
 const n=document.getElementById("app").innerHTML.length;
 say(n>40?"App ran and drew the page":"App did not draw the page", n>40);
})();
</script>
